<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About Us</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
  <style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  display: flex;
  font-family: 'Fira Code', monospace;
  height: 100vh;
  background: linear-gradient(to right, #e0e0e0, #ffffff);
}

.sidebar {
  width: 250px;
  background-color: #1e1e2f;
  padding: 40px 20px;
  color: white;
  box-shadow: 3px 0 10px rgba(0,0,0,0.1);
}

.sidebar nav a {
  display: block;
  color: #ddd;
  text-decoration: none;
  font-size: 1.2em;
  margin: 20px 0;
  transition: 0.3s ease;
  padding: 10px;
  border-radius: 5px;
}

.sidebar nav a:hover {
  background-color: #3c3c5b;
  color: #ffffff;
}

.main-content {
  flex: 1;
  padding: 60px;
  background: #f8f9fa;
}

.main-content h1 {
  font-size: 2.5em;
  color: #333;
  margin-bottom: 20px;
}

.main-content p {
  font-size: 1.2em;
  color: #666;
}

.sidebar nav a.active {
  background-color: #3c3c5b;
  color: #fff;
  font-weight: bold;
}

</style>

</head>
<body>
  <div class="sidebar">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html" class="active">About</a>
      <a href="#">Contact Us</a>
      <a href="#">Services</a>
      <a href="#">Clients & Partners</a>
      <a href="#">Blog/News</a>
    </nav>
  </div>
  <div class="main-content">
    <h1>About Us</h1>
    <p>Kami adalah web develover profesional yang melayani jasa pembuatan web</p>
  </div>
</body>
</html>
